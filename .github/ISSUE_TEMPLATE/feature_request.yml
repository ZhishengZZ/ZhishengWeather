name: 功能请求
description: 提议新功能或体验优化
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好点子先聊透再动手。建议先在 Discussions 里发起讨论，达成共识后再来开这个请求。
  - type: textarea
    id: idea
    attributes:
      label: 想要什么功能
      placeholder: 用一两段话描述它长什么样、怎么用
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 解决什么问题
      placeholder: 它改善了哪个场景？现在是怎么将就的？
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 属于哪块
      options:
        - 主页界面
        - 数据源 / 融合层
        - 图标与美术
        - 设置 / 偏好
        - 其他
    validations:
      required: true
  - type: checkboxes
    id: style
    attributes:
      label: 风格共识
      options:
        - label: 我理解功能实现要服从整体的终端美术风格，呈现方式可能被调整
          required: true
