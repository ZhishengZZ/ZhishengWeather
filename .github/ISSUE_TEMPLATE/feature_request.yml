name: Feature Request // 功能请求
description: 为终端提议新功能或体验优化 — Propose a new feature or UX improvement for the terminal
title: "[FEAT] "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        好点子先聊透再动手。建议先在 Discussions 发起讨论，凝聚共识后再建本请求。
        Good ideas deserve a conversation first. Consider starting a thread in Discussions before filing this request.
  - type: textarea
    id: idea
    attributes:
      label: 功能描述 // IDEA
      placeholder: 用一两段话描述这个功能长什么样、怎么用 / In a paragraph or two: what it looks like and how it works
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: 解决的问题 // WHY
      placeholder: 它改善了什么场景？没有它现在怎么绕？ / What scenario does it improve? How do you work around its absence today?
    validations:
      required: true
  - type: dropdown
    id: scope
    attributes:
      label: 所属模块 // SCOPE
      options:
        - 主页 UI / Home UI
        - 数据源 / 融合层 / Data feeds & fusion
        - 图标与美术 / Glyphs & art
        - 设置 / 偏好 / Settings & preferences
        - 其他 / Other
    validations:
      required: true
  - type: checkboxes
    id: style
    attributes:
      label: 风格共识 // STYLE
      options:
        - label: 我理解实现需服从 EVA / NERV 磷光终端的整体美术风格，可能被调整呈现方式。I understand the implementation must serve the EVA / NERV phosphor-terminal aesthetic, and its presentation may be adjusted.
          required: true
